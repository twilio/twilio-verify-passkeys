name: Shared Checks

# Reusable workflow with the common Kotlin/KMP checks (assemble, ktlint,
# detekt, Kover unit tests + Danger). Invoked by android-development and
# ios-development. Every step only calls a script under scripts/.
#
# All actions are pinned to a full commit SHA (enterprise policy requires it;
# a tag like @v4 is rejected).

on:
  workflow_call:

env:
  DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  assemble:
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # enterprise-allowlisted
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: ./scripts/install_openjdk.sh
      - run: ./scripts/run_gradle_task.sh assembleDebug :shared:assembleRelease assembleDebugAndroidTest
      - run: ./scripts/move_directory.sh shared/build/outputs/apk/androidTest/debug/ builds
      - run: ./scripts/move_directory.sh shared/build/outputs/aar/ builds
      - run: ./scripts/danger_check.sh "--danger_id=assemble --dangerfile=dangerfiles/dangerfile_pr_validation"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-builds
          path: builds/

  lint-check:
    runs-on: ubuntu-x64
    needs: assemble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # enterprise-allowlisted
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: ./scripts/install_openjdk.sh
      - run: ./scripts/run_gradle_task.sh ktlintCheck
      - run: ./scripts/danger_check.sh "--danger_id=lint --dangerfile=dangerfiles/dangerfile_ktlint"

  detekt-check:
    runs-on: ubuntu-x64
    needs: assemble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # enterprise-allowlisted
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: ./scripts/install_openjdk.sh
      - run: ./scripts/run_gradle_task.sh detekt
      - run: ./scripts/danger_check.sh "--danger_id=detekt --dangerfile=dangerfiles/dangerfile_detekt"

  android-unit-tests:
    runs-on: ubuntu-x64
    needs: [lint-check, detekt-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # enterprise-allowlisted
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: ./scripts/install_openjdk.sh
      - run: ./scripts/run_gradle_task.sh :shared:koverXmlReportDebug
      - run: ./scripts/danger_check.sh "--danger_id=unit_tests --dangerfile=dangerfiles/dangerfile_code_coverage"
      - run: ./scripts/run_gradle_task.sh :shared:koverVerify
      - if: always()
        run: ./scripts/copy_test_results.sh ~/test-results/junit
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unit-test-results
          path: ~/test-results/
