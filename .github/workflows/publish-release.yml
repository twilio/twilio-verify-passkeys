name: Publish release

# Stage 2 of the release flow. When a release PR from Prepare release merges
# into main, publishes every platform whose version in gradle.properties isn't
# tagged yet:
#   KMP: tag <version>-kmp, publish to Maven Central, create the GitHub release.
#   iOS: tag <version>-ios, build the XCFramework, release it from
#        twilio-verify-passkeys-ios, create the GitHub release.
# Each step checks whether it already happened, so a failed run can be re-run.
# The logic lives in fastlane lanes (fastlane/Fastfile).

on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:

concurrency:
  group: publish-release

permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'

jobs:
  check:
    name: Check release
    if: github.repository_owner == 'twilio' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-x64' }}
    timeout-minutes: 10
    outputs:
      kmp_version: ${{ steps.check.outputs.kmp_version }}
      kmp_tagged: ${{ steps.check.outputs.kmp_tagged }}
      kmp_on_central: ${{ steps.check.outputs.kmp_on_central }}
      ios_version: ${{ steps.check.outputs.ios_version }}
      ios_tagged: ${{ steps.check.outputs.ios_tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - id: check
        run: bundle exec fastlane release_status

  tag:
    name: Tag the release
    needs: check
    if: needs.check.outputs.kmp_tagged == 'false' || needs.check.outputs.ios_tagged == 'false'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-x64' }}
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      KMP_TAG: ${{ needs.check.outputs.kmp_tagged == 'false' && format('{0}-kmp', needs.check.outputs.kmp_version) || '' }}
      IOS_TAG: ${{ needs.check.outputs.ios_tagged == 'false' && format('{0}-ios', needs.check.outputs.ios_version) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          for tag in $KMP_TAG $IOS_TAG; do
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          done

  # Kotlin/Native publications need macOS, as they did on CircleCI.
  publish-kmp:
    name: Publish KMP to Maven Central
    needs: [check, tag]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      needs.check.outputs.kmp_on_central == 'false'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-arm' }}
    environment: production
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-env
      - name: Set up the Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            ./scripts/setup_android_sdk.sh
          fi
      - name: Publish
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEY_RING_FILE: ${{ runner.temp }}/secring.gpg
          OSSRH_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
        run: bundle exec fastlane publish_kmp

  github-release-kmp:
    name: Create the KMP GitHub release
    needs: [check, publish-kmp]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.publish-kmp.result == 'success' ||
        (needs.publish-kmp.result == 'skipped' && needs.check.outputs.kmp_on_central == 'true'))
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-x64' }}
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.kmp_version }}-kmp
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec fastlane github_release tag:"$TAG"

  build-ios-framework:
    name: Build the iOS XCFramework
    needs: [check, tag]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      needs.check.outputs.ios_tagged == 'false'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-arm' }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
      - run: bundle exec fastlane xcframework
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release-framework
          path: releaseFramework.zip
          if-no-files-found: error

  publish-ios:
    name: Publish iOS
    needs: [check, build-ios-framework]
    if: always() && needs.build-ios-framework.result == 'success'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-x64' }}
    environment: production
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub release in this repo
    env:
      VERSION: ${{ needs.check.outputs.ios_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-release-framework
      - name: Release from twilio-verify-passkeys-ios
        env:
          GH_TOKEN: ${{ secrets.IOS_RELEASE_TOKEN }}
          GITHUB_USER_NAME: ${{ secrets.GH_USER_NAME }}
          GITHUB_USER_EMAIL: ${{ secrets.GH_USER_EMAIL }}
        run: bundle exec fastlane publish_ios version:"$VERSION"
      - name: Create the iOS GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec fastlane github_release tag:"$VERSION-ios"
