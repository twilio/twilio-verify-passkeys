name: Android Development

# Development pipeline for Android: shared Kotlin/KMP checks, SDK size report,
# instrumented tests, AAR generation, sample app and E2E tests.
# Every step only calls a script under scripts/. Actions are pinned to a full
# commit SHA (enterprise policy requires it).

on:
  # PRs validate feature branches; push only runs on dev (avoids double runs
  # when a branch with an open PR is pushed). E2E jobs are gated to dev.
  push:
    branches:
      - dev
  pull_request:
    branches-ignore:
      - main
  workflow_dispatch:

# Cancel an in-progress run when a newer commit arrives on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  shared-checks:
    uses: ./.github/workflows/shared-checks.yml
    secrets: inherit

  android-sdk-size-report:
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # enterprise-allowlisted
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: ./scripts/install_openjdk.sh
      - run: ./scripts/setup_apkanalyzer.sh
      - run: ./scripts/run_gradle_task.sh generateSizeReport
      - run: ./scripts/move_directory.sh shared/build/outputs/sizeReport/ builds
      - run: ./scripts/danger_check.sh "--danger_id=android_sdk_report --dangerfile=dangerfiles/dangerfile_android_sdk_size_report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-size-report
          path: shared/build/outputs/sizeReport

  android-instrumented-tests:
    runs-on: ubuntu-x64
    needs: shared-checks
    env:
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-builds
          path: builds/
      - run: ./scripts/run_android_instrumented_tests.sh

  android-generate-aar:
    runs-on: ubuntu-x64
    needs: android-instrumented-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-builds
          path: builds/
      - run: ./scripts/create_aars.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aars
          path: |
            TwilioPasskeys-debug.aar
            TwilioPasskeys.aar

  generate-sample-app:
    runs-on: ubuntu-x64
    needs: android-instrumented-tests
    env:
      SAMPLE_BACKEND_URL: ${{ secrets.SAMPLE_BACKEND_URL }}
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    outputs:
      app_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: ./scripts/install_openjdk.sh
      - run: ./scripts/update_gradle_properties.sh sampleBackendUrl "\"${SAMPLE_BACKEND_URL}\"" androidApp/gradle.properties
      - run: ./scripts/build_android_simulator_app.sh
      - run: ./scripts/install_firebase_cli.sh
      - run: ./scripts/deploy_to_firebase.sh android
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-sample-app
          path: sample-app.zip

  run-e2e-tests:
    runs-on: ubuntu-x64
    needs: generate-sample-app
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    # Manual approval gate replaces the CircleCI `wait-for-*` approval job.
    environment: e2e-android-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          APP_URL: ${{ needs.generate-sample-app.outputs.app_url }}
          WORKFLOW_ID: ${{ github.run_id }}
        run: ./scripts/start_e2e_tests_pipeline.sh android "$APP_URL" "$WORKFLOW_ID" wait-for-android-local-sdk-e2e-tests
