name: Android Release

# Release pipeline for the KMP SDK, triggered by a release tag.
# Replaces the CircleCI release-kmp continuation. Every step only calls a script
# under scripts/. Actions are pinned to a full commit SHA (enterprise policy
# requires it).

on:
  push:
    tags:
      - 'release-passkeys-android-*.*.*'

env:
  TMP_WORKSPACE: tmp/workspace
  ENV_VARS_FILE: env_vars
  # Selects Xcode 26.6 on the macOS publish-internal job (ignored elsewhere).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  pre-release-check:
    runs-on: ubuntu-x64
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # enterprise-allowlisted
        with:
          ruby-version: '3.3'
      - id: check
        run: ./scripts/release/pre_release_check.sh kmp

  publish-internal:
    runs-on: macos-arm
    needs: pre-release-check
    if: needs.pre-release-check.outputs.should_release == 'true'
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_SECRET_KEY_RING_FILE: ${{ secrets.SIGNING_SECRET_KEY_RING_FILE }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./scripts/setup_android_sdk.sh
      - run: ./scripts/generate_signing_keyring.sh
      - run: ./scripts/publish_kmp_internal.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmp-release-env
          path: ${{ env.TMP_WORKSPACE }}/${{ env.ENV_VARS_FILE }}

  publish-maven:
    runs-on: ubuntu-x64
    needs: publish-internal
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_SECRET_KEY_RING_FILE: ${{ secrets.SIGNING_SECRET_KEY_RING_FILE }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # enterprise-allowlisted
        with:
          ruby-version: '3.3'
      - run: ./scripts/install_openjdk.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kmp-release-env
          path: ${{ env.TMP_WORKSPACE }}
      - run: ./scripts/publish_kmp_to_maven_central.sh
      - run: ./scripts/create_kmp_github_release.sh "$RELEASE_REF"
        env:
          RELEASE_REF: ${{ github.ref_name }}
